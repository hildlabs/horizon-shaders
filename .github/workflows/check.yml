# Runs the check the game, the launcher and the registry run, and packages the .hshader.
name: check

on:
  push:
  pull_request:

env:
  # Horizon's main with #8557 ([shadow] option, resolution_option, distance_option).
  HORIZON_REV: ee06d18c391102428fa5dded4f3d9d091ea361f0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/horizon-shader
          key: horizon-shader-${{ env.HORIZON_REV }}
      - name: Install horizon-shader
        run: |
          command -v horizon-shader || cargo install --git https://github.com/horizon-rust/horizon \
            --rev "$HORIZON_REV" horizon-shader-api --locked
      - run: horizon-shader check pack/daybreak
      - run: horizon-shader pack pack/daybreak
      - uses: actions/upload-artifact@v4
        with:
          name: daybreak
          path: pack/*.hshader
