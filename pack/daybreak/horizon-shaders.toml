schema = 1
id = "daybreak"
name = "Daybreak"
version = "0.3.0"
api = "0.1"
description = "Sun shadows, warm sunlight and blue shade, waving plants, reflective water, coloured block light, sun rays and glare, haze and bloom. Built to cost as little GPU time as possible."
authors = ["hildlabs"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky"

[material]
file = "material.wgsl"
files = ["lighting.wgsl", "water.wgsl"]
name = "Lighting"

[vertex]
file = "vertex.wgsl"
name = "Wind and waves"

[shadow]
# The shadow pass is most of what Daybreak costs: it draws every section in the light's square
# again, on the CPU's lists, and half the distance is a quarter of the terrain. The default, 64
# blocks at 1536 texels, is sharper near the camera than 0.2's 96 at 2048, for less than half
# the sections. The player's options set all three:
# `shadows` off means no map and no pass at all.
option = "shadows"
resolution_option = "shadow_detail"
distance_option = "shadow_range"
resolution = 1536
distance = 64.0
# Leaves cast whole shadows: no alpha test in the shadow pass, and no shimmer far away.
solid_materials = [1]

[reflection]
option = "reflections"

# Half-resolution work is a quarter of the pixels; a quarter is a sixteenth.
[[post]]
file = "post/bloom_prefilter.wgsl"
name = "Bloom prefilter"
output = "bloom_a"
scale = 0.25

[[post]]
file = "post/bloom_blur.wgsl"
name = "Bloom blur"
output = "bloom_b"
scale = 0.25

[[post]]
file = "post/sun_rays.wgsl"
name = "Sun rays and glare"
output = "rays"
scale = 0.25

[[post]]
file = "post/composite.wgsl"
name = "Composite"

[budget]
gpu_ms = 1.5

# --- Materials: MaterialInput.material and VertexInput.material (ids in common.wgsl) ---

[[materials]]
id = 1
sprites = ["block/*_leaves"]

[[materials]]
id = 2
sprites = [
  "block/short_grass", "block/short_dry_grass", "block/tall_dry_grass", "block/fern", "block/bush",
  "block/dead_bush", "block/firefly_bush", "block/*_sapling", "block/dandelion", "block/poppy",
  "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy",
  "block/cornflower", "block/lily_of_the_valley", "block/wither_rose", "block/torchflower",
  "block/closed_eyeblossom", "block/open_eyeblossom", "block/wheat_stage*", "block/carrots_stage*",
  "block/potatoes_stage*", "block/beetroots_stage*", "block/sweet_berry_bush_stage*",
]

[[materials]]
id = 3
sprites = [
  "block/tall_grass_bottom", "block/large_fern_bottom", "block/sunflower_bottom", "block/lilac_bottom",
  "block/rose_bush_bottom", "block/peony_bottom", "block/pitcher_plant_bottom",
]

[[materials]]
id = 4
sprites = [
  "block/tall_grass_top", "block/large_fern_top", "block/sunflower_top", "block/sunflower_front",
  "block/sunflower_back", "block/lilac_top", "block/rose_bush_top", "block/peony_top",
  "block/pitcher_plant_top",
]

[[materials]]
id = 5
sprites = ["block/vine", "block/cave_vines*", "block/weeping_vines*", "block/twisting_vines*"]

# --- Coloured block light (block_light_color) ---
# Only light of another colour than block light's own warm tint (lighting.wgsl, `block_light`):
# torches, lanterns, fire, glowstone, lava and redstone lamps are that tint already. Horizon
# rebuilds the colour grid on the CPU when the camera moves on 16 blocks or a listed block
# changes, so every source listed here costs frame time (a wall of redstone lamps switching, a
# lava lake), and one that only repeats the tint costs it for nothing.

[[lights]]
color = [0.35, 0.75, 1.0]
blocks = ["soul_*"]

[[lights]]
color = [1.0, 0.25, 0.15]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [0.6, 0.92, 1.0]
blocks = ["sea_lantern", "beacon", "conduit"]

[[lights]]
color = [0.75, 0.4, 1.0]
blocks = ["amethyst_cluster", "*_amethyst_bud", "crying_obsidian", "nether_portal", "respawn_anchor"]

[[lights]]
color = [0.5, 1.0, 0.55]
blocks = ["copper_torch", "copper_wall_torch", "copper_lantern", "verdant_froglight"]

[[lights]]
color = [1.0, 0.7, 0.95]
blocks = ["pearlescent_froglight"]

[[lights]]
color = [0.92, 0.95, 1.0]
blocks = ["end_rod"]

[[particle_lights]]
particles = ["firefly"]
color = [0.8, 0.95, 0.35]
reach = 3.0

# --- Options: each one a WGSL `override` of the same name ---

[[pages]]
id = "main"
name = "Daybreak"
items = ["page:lighting", "page:water", "page:nature", "page:atmosphere", "page:camera", ""]

[[pages]]
id = "lighting"
name = "Lighting"
description = "Sun shadows and the light of the sky and of blocks."
items = ["shadows", "shadow_softness", "shadow_detail", "shadow_range", "sun_strength", "ambient_strength", "block_light_strength", "colored_lights", "relight_entities", ""]

[[pages]]
id = "water"
name = "Water"
description = "Reflections, waves and how far you see into water."
items = ["screen_reflections", "reflections", "water_waves", "water_clarity"]

[[pages]]
id = "nature"
name = "Nature"
description = "Leaves and plants in the wind."
items = ["waving", "wave_strength"]

[[pages]]
id = "atmosphere"
name = "Atmosphere"
description = "The sky's colours, the sun's rays and glare, and haze."
items = ["sky_style", "god_rays", "sun_glare", "haze"]

[[pages]]
id = "camera"
name = "Camera"
description = "Glow, exposure and the colour grade."
items = ["bloom", "exposure", "contrast", "saturation", "vignette", ""]

[[options]]
id = "shadows"
name = "Shadows"
description = "Shadows cast by the sun and the moon. Off saves the most GPU time: there is no shadow pass at all."
type = "bool"
default = true

[[options]]
id = "shadow_detail"
name = "Shadow detail"
description = "The shadow map's size in texels: sharper shadows from a finer map, at more cost."
type = "choice"
values = ["1024", "1536", "2048", "4096"]
default = "1536"

[[options]]
id = "shadow_range"
name = "Shadow distance"
description = "How far from you, in blocks, things cast shadows. The terrain drawn into the map grows with its square."
type = "choice"
values = ["48", "64", "96", "160"]
default = "64"

[[options]]
id = "shadow_softness"
name = "Shadow edges"
description = "Sharp reads the shadow map once, soft four times, very soft nine times."
type = "choice"
values = ["Sharp", "Soft", "Very soft"]
default = "Soft"

[[options]]
id = "sun_strength"
name = "Sunlight"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "ambient_strength"
name = "Sky light"
description = "The light from the sky in the shade."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "block_light_strength"
name = "Block light"
description = "Torches, lanterns, glowstone and lava."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "colored_lights"
name = "Coloured light"
description = "Soul fire blue, redstone red, copper green."
type = "bool"
default = true

[[options]]
id = "relight_entities"
name = "Mob shadows"
description = "Mobs, chests and particles take the sun's shadow and the sky's light like terrain does."
type = "bool"
default = true

[[options]]
id = "screen_reflections"
name = "Reflections"
description = "Water reflects what is on the screen, and the sky where the screen ends. No extra pass: it costs a few texture reads per pixel of water."
type = "bool"
default = true

[[options]]
id = "reflections"
name = "Full mirror"
description = "Water mirrors the whole world, also what is off the screen. Costs a half-resolution pass of the terrain near water, and while it is drawn Horizon culls the world on the CPU instead of the GPU."
type = "bool"
default = false

[[options]]
id = "water_waves"
name = "Waves"
type = "bool"
default = true

[[options]]
id = "water_clarity"
name = "Water clarity"
description = "How far you see into water."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "waving"
name = "Waving plants"
type = "bool"
default = true

[[options]]
id = "wave_strength"
name = "Wind"
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1

[[options]]
id = "sky_style"
name = "Sky colour"
description = "0 is vanilla's sky, 1 a deeper blue with warm sunsets."
type = "float"
default = 0.8
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "god_rays"
name = "Sun rays"
type = "float"
default = 0.5
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "sun_glare"
name = "Sun glare"
description = "The glow, streak and lens ghosts of looking into the sun."
type = "float"
default = 0.7
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "haze"
name = "Haze"
description = "Air between you and distant land, warm toward the sun."
type = "float"
default = 0.6
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "bloom"
name = "Bloom"
description = "The soft glow around bright things."
type = "float"
default = 0.5
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 0.12
min = 0.0
max = 1.0
step = 0.02

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.05
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "float"
default = 0.25
min = 0.0
max = 1.0
step = 0.05
